name: "Ecobee Web Control"
version: "1.4.0"
slug: "ecobee_web_control"
description: "Control Ecobee thermostats via web interface automation"
url: "https://github.com/JakubOleksy/ecobee.control"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
hassio_api: true
homeassistant_api: true
hassio_role: default
host_network: true
ingress: true
ingress_port: 5000
panel_icon: mdi:thermostat
panel_title: Ecobee Web Control
webui: "http://[HOST]:[PORT:5000]"
options:
  ecobee_username: ""
  ecobee_password: ""
  ecobee_totp_secret: ""
  webdriver_headless: true
  log_level: "INFO"
  api_port: 5000
schema:
  ecobee_username: str
  ecobee_password: password
  ecobee_totp_secret: password?
  webdriver_headless: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)?
  api_port: port
